name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      bin: ${{ steps.release.outputs.bin }}
      features: ${{ steps.release.outputs.features }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tagged source
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - run: just check
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Audit worker dependencies before release side effects
        run: cd worker && npm ci --no-audit && npm audit

  build:
    needs: validation
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
            architecture: arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            architecture: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --no-default-features --features ${{ needs.validation.outputs.features }} \
            --bin ${{ needs.validation.outputs.bin }}

      - name: Package
        env:
          BIN: ${{ needs.validation.outputs.bin }}
          VERSION: ${{ needs.validation.outputs.version }}
        run: |
          set -euo pipefail
          NAME="${BIN}-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/$BIN dist/$NAME
          test "$(lipo -archs "dist/$NAME")" = '${{ matrix.architecture }}'
          test "$("dist/$NAME" --version)" = "$BIN $VERSION"
          (cd dist && COPYFILE_DISABLE=1 tar czf "$NAME.tar.gz" "$NAME")
          test "$(tar -tzf "dist/$NAME.tar.gz")" = "$NAME"
          tar -xOf "dist/$NAME.tar.gz" "$NAME" | cmp - "dist/$NAME"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.validation.outputs.prerelease == 'true' }}
          files: dist/${{ needs.validation.outputs.bin }}-${{ matrix.target }}.tar.gz

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: cd worker && npm ci --no-audit && npm audit

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd worker && npx wrangler deploy

  update-homebrew:
    needs: [validation, build, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          BIN: ${{ needs.validation.outputs.bin }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          REPO="dliv/workforest"
          TAP_REPO="dliv/homebrew-tools"

          AARCH64_URL="https://github.com/$REPO/releases/download/v$VERSION/${BIN}-aarch64-apple-darwin.tar.gz"
          X86_64_URL="https://github.com/$REPO/releases/download/v$VERSION/${BIN}-x86_64-apple-darwin.tar.gz"

          # Download release tarballs (fail fast on 404)
          curl -fSL -o aarch64.tar.gz "$AARCH64_URL"
          curl -fSL -o x86_64.tar.gz "$X86_64_URL"

          AARCH64_SHA=$(sha256sum aarch64.tar.gz | cut -d' ' -f1)
          X86_64_SHA=$(sha256sum x86_64.tar.gz | cut -d' ' -f1)

          echo "aarch64 SHA256: $AARCH64_SHA"
          echo "x86_64 SHA256: $X86_64_SHA"

          FORMULA="Formula/${BIN}.rb"

          # Clone the tap repo, update formula, push
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/$TAP_REPO.git" tap
          cd tap

          sed -i "s/version \".*\"/version \"$VERSION\"/" "$FORMULA"
          sed -i "/CPU.arm?/{n;n;s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$AARCH64_SHA\"/}" "$FORMULA"
          sed -i "/CPU.intel?/{n;n;s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$X86_64_SHA\"/}" "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git diff --cached --quiet && echo "No changes to formula" && exit 0
          git commit -m "chore: bump $BIN to $VERSION"
          git push
