name: Release publication

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved main merge SHA
        required: true
        type: string
      version:
        description: Approved version without v prefix
        required: true
        type: string
      candidate_run:
        description: Successful candidate workflow run ID
        required: true
        type: string
      candidate_attempt:
        description: Approved current candidate run attempt
        required: true
        type: string

# Stable and beta deploy one worker containing both channel versions.
concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    name: Promote approved candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify candidate then promote without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 scripts/release.py promote "$VERSION" "$EXPECTED_SHA" "$CANDIDATE_RUN" "$CANDIDATE_ATTEMPT"
