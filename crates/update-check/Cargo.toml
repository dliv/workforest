[package]
name = "git-forest-update-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
ts-rs = "12"

[lints]
workspace = true
