[package]
name = "git-forest"
version = "0.6.1"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
git-forest-core = { path = "crates/forest/core" }
git-forest-update-check = { path = "crates/update-check" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["stable"]
stable = []
beta = []

[[bin]]
name = "git-forest"
path = "src/bin/git-forest.rs"
required-features = ["stable"]

[[bin]]
name = "git-forest-beta"
path = "src/bin/git-forest-beta.rs"
required-features = ["beta"]

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
serial_test = "3"
tempfile = "3"

[workspace]
members = ["crates/forest/core", "crates/policy", "crates/update-check"]

[workspace.lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[lints]
workspace = true
